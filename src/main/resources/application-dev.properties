# dev = Spark standalone cluster installed on this Windows machine (1 master + 2 workers)
# Run with: --spring.profiles.active=dev
spark.master=spark://localhost:7077
spark.app-name=weather-etl-dev
spark.conf.[spark.driver.host]=localhost
spark.conf.[spark.executor.memory]=1g
spark.conf.[spark.executor.cores]=1
# 2 cores in total = 1 executor on each worker
spark.conf.[spark.cores.max]=2
# Executors read MongoDB and write MySQL, so they need these jars.
# They are copied to target/executor-jars by "mvn package" (maven-dependency-plugin in pom.xml).
spark.conf.[spark.jars]=target/executor-jars/mongo-spark-connector_2.12.jar,target/executor-jars/mongodb-driver-sync.jar,target/executor-jars/mongodb-driver-core.jar,target/executor-jars/bson.jar,target/executor-jars/bson-record-codec.jar,target/executor-jars/mysql-connector-j.jar



# ---------- OpenMetadata lineage (OpenLineage) ----------
spark.conf.[spark.extraListeners]=io.openlineage.spark.agent.OpenLineageSparkListener
spark.conf.[spark.openlineage.transport.type]=http
spark.conf.[spark.openlineage.transport.url]=http://localhost:8585
spark.conf.[spark.openlineage.transport.endpoint]=/api/v1/openlineage/lineage
spark.conf.[spark.openlineage.transport.auth.type]=api_key
spark.conf.[spark.openlineage.transport.auth.apiKey]=${OM_JWT_TOKEN}
spark.conf.[spark.openlineage.namespace]=weather_etl
spark.conf.[spark.openlineage.parentJobName]=weather_etl_pipeline

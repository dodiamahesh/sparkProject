# prod = Docker: spark-master + 2 workers + this app (Spark driver) in one docker network
# Activated by docker-compose.yml (SPRING_PROFILES_ACTIVE=prod)

# MySQL runs on the Windows host; containers reach it via host.docker.internal
spring.datasource.url=jdbc:mysql://${DB_HOST:host.docker.internal}:3306/dataengineering?allowPublicKeyRetrieval=true
spring.jpa.show-sql=false

spark.master=spark://spark-master:7077
spark.app-name=weather-etl-prod
# executors connect back to the driver using the container name
spark.conf.[spark.driver.host]=etl-app
spark.conf.[spark.driver.bindAddress]=0.0.0.0
spark.conf.[spark.executor.memory]=1g
spark.conf.[spark.executor.cores]=1
spark.conf.[spark.cores.max]=2

# ./inputData is mounted as /data in the app and in both workers
etl.source-file=/data/originalFile/data1.json
etl.processed-dir=/data/processedFile

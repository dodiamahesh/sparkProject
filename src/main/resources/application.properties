spring.application.name=spark-medallion-pipeline
spring.main.web-application-type=none
# Flyway is started from code for two databases (de_silver, de_gold), not by Spring Boot
spring.flyway.enabled=false

# ---------- Bronze (MongoDB) ----------
pipeline.mongo-uri=mongodb://localhost:27017/?replicaSet=rs0
pipeline.bronze-database=de_bronze

# ---------- Silver / Gold (MySQL) ----------
pipeline.silver-jdbc-url=jdbc:mysql://localhost:3306/de_silver
pipeline.gold-jdbc-url=jdbc:mysql://localhost:3306/de_gold
pipeline.db-username=root
pipeline.db-password=Root@123

# ---------- Scheduling / incremental ----------
# pause between the end of one pipeline run and the start of the next (Job #1 -> Job #2)
pipeline.interval-ms=120000
# Job #1 reads bronze only up to (now - lag), so records the sink is still writing are not skipped
pipeline.safety-lag-minutes=2

# ---------- Parallelism (see docs/SPARK_PERFORMANCE_TUNING.md) ----------
# partitions = parallel tasks = parallel MySQL connections on write (~2-3 x total executor cores)
pipeline.partitions=4
# rows per INSERT batch
pipeline.jdbc-batch-size=5000

# ---------- Spark (default = local, override per profile / env var) ----------
spark.master=${SPARK_MASTER:local[*]}
spark.app-name=medallion-pipeline
# Any Spark setting can be added as: spark.conf.[<spark key>]=<value>
spark.conf.[spark.ui.port]=4040
spark.conf.[spark.sql.shuffle.partitions]=8

logging.level.root=WARN
logging.level.com.de=INFO

# Second CDC flow: sourceMongo_db (transaction DB) -> topic sourceMongo_db -> bronze_db
# Connector: kafka-connect/mongo-cdc-sourcemongo-source.json (its RegexRouter names the topic after the database)
# Run:  java -jar target\mongo-cdc-subscriber-1.0.0-jar-with-dependencies.jar src\main\resources\subscriber-sourcemongo.properties
# It runs NEXT TO the de_source_mongo subscriber (own topic, own consumer group, own target database).

# ---- Kafka ----
kafka.bootstrap.servers=localhost:9092
kafka.topic=sourceMongo_db
kafka.group.id=mongo-cdc-subscriber-sourcemongo
kafka.dlq.topic=sourceMongo_db.dlq

# ---- MongoDB ----
mongo.uri=mongodb://localhost:27017/?replicaSet=rs0
# Every source collection is written to the collection with the same name in this database.
# A HARD delete in sourceMongo_db becomes a SOFT delete here: _deleted: true, _op: "delete" (last values kept).
target.database=bronze_db

# Apply "drop collection" events to the target? (false = only log them)
apply.drop=false

# ---- Logging (slf4j-simple) ----
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.apache.kafka=warn
org.slf4j.simpleLogger.showDateTime=true

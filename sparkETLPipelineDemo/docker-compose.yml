# Optional: local MongoDB (bronze) + PostgreSQL (silver) with the same settings as application-dev.yml
#   docker compose up -d
services:
  mongodb:
    image: mongo:8
    container_name: etl-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  postgres:
    image: postgres:17
    container_name: etl-postgres
    environment:
      POSTGRES_DB: silver_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  mongo-data:
  postgres-data:

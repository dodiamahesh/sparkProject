# =====================================================================
#  PROD PROFILE
#  All secrets / hosts come from environment variables. Never commit real passwords.
#  Run: java -jar spark-etl-pipeline-1.0.0.jar --spring.profiles.active=prod
# =====================================================================
spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGO_DATABASE:bronze_db}

etl:
  spark:
    # e.g. local[*] for a single server, or spark://host:7077 for a standalone cluster
    master: ${SPARK_MASTER:local[*]}
    config:
      "[spark.sql.shuffle.partitions]": "${SPARK_SHUFFLE_PARTITIONS:50}"
      "[spark.ui.enabled]": "false"
      "[spark.sql.ansi.enabled]": "false"
      "[spark.sql.legacy.timeParserPolicy]": "CORRECTED"
  postgres:
    batch-size: 5000
  job:
    thread-pool-size: ${ETL_THREAD_POOL_SIZE:4}
  sample-data:
    load-on-startup: false

logging:
  level:
    com.demo.etl: INFO
